---
- name: Build and deploy the Arcadia frontend on the current VM
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    frontend_dir: "{{ repo_root }}/frontend/main"
    web_root: /var/www/arcadia
    node_major_version: "20"
    node_arch_map:
      x86_64: x64
      aarch64: arm64
    node_arch: "{{ node_arch_map.get(ansible_architecture, '') }}"
    node_archive: "node-v{{ node_version }}-linux-{{ node_arch }}.tar.xz"
    node_url: "https://nodejs.org/dist/v{{ node_version }}/{{ node_archive }}"
    node_install_dir: "/opt/node-v{{ node_version }}-linux-{{ node_arch }}"
    node_bin_dir: /usr/local/bin

  pre_tasks:
    - name: Verify Amazon Linux
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Amazon"
        fail_msg: "This playbook supports Amazon Linux only."

    - name: Verify the repository frontend path
      ansible.builtin.stat:
        path: "{{ frontend_dir }}/package.json"
      register: frontend_package

    - name: Stop when the frontend path is invalid
      ansible.builtin.assert:
        that:
          - frontend_package.stat.exists
          - frontend_package.stat.isreg
        fail_msg: >-
          Expected {{ frontend_dir }}/package.json. Run setup-frontent/setup.sh
          from the cloned arcadia2.0 repository.

    - name: Verify the CPU architecture
      ansible.builtin.assert:
        that:
          - node_arch | length > 0
        fail_msg: "Unsupported CPU architecture: {{ ansible_architecture }}"

    - name: Read current Node.js release metadata
      ansible.builtin.uri:
        url: "https://nodejs.org/dist/latest-v{{ node_major_version }}.x/SHASUMS256.txt"
        return_content: true
      register: node_checksums

    - name: Determine current Node.js version and checksum
      ansible.builtin.set_fact:
        node_version: >-
          {{ (node_checksums.content | regex_search('node-v([0-9.]+)-linux-' ~ node_arch ~ '\\.tar\\.xz', '\1'))[0] }}
        node_checksum: >-
          {{ (node_checksums.content.splitlines()
              | select('search', '  node-v[0-9.]+-linux-' ~ node_arch ~ '\\.tar\\.xz$')
              | first).split()[0] }}

  tasks:
    - name: Install operating-system packages
      ansible.builtin.dnf:
        name:
          - nginx
          - tar
          - xz
        state: present
        update_cache: true

    - name: Download Node.js
      ansible.builtin.get_url:
        url: "{{ node_url }}"
        dest: "/var/tmp/{{ node_archive }}"
        checksum: "sha256:{{ node_checksum }}"
        mode: "0644"

    - name: Check whether this Node.js release is installed
      ansible.builtin.stat:
        path: "{{ node_install_dir }}/bin/node"
      register: installed_node

    - name: Extract Node.js
      ansible.builtin.unarchive:
        src: "/var/tmp/{{ node_archive }}"
        dest: /opt
        remote_src: true
      when: not installed_node.stat.exists

    - name: Link Node.js commands globally
      ansible.builtin.file:
        src: "{{ node_install_dir }}/bin/{{ item }}"
        dest: "{{ node_bin_dir }}/{{ item }}"
        state: link
        force: true
      loop:
        - node
        - npm
        - npx

    - name: Install locked frontend dependencies
      ansible.builtin.command:
        cmd: npm ci
        chdir: "{{ frontend_dir }}"
      environment:
        PATH: "/usr/local/bin:{{ ansible_env.PATH }}"
      changed_when: true

    - name: Build the production frontend
      ansible.builtin.command:
        cmd: npm run build
        chdir: "{{ frontend_dir }}"
      environment:
        PATH: "/usr/local/bin:{{ ansible_env.PATH }}"
        NODE_ENV: production
        NODE_OPTIONS: --openssl-legacy-provider
      changed_when: true

    - name: Verify that the build produced index.html
      ansible.builtin.stat:
        path: "{{ frontend_dir }}/dist/index.html"
      register: built_index

    - name: Stop when the frontend build is missing
      ansible.builtin.assert:
        that:
          - built_index.stat.exists
        fail_msg: "The frontend build did not produce {{ frontend_dir }}/dist/index.html."

    - name: Create the Nginx document root
      ansible.builtin.file:
        path: "{{ web_root }}"
        state: directory
        owner: nginx
        group: nginx
        mode: "0755"

    - name: Deploy the frontend build
      ansible.builtin.copy:
        src: "{{ frontend_dir }}/dist/"
        dest: "{{ web_root }}/"
        owner: nginx
        group: nginx
        mode: preserve
      notify: Reload nginx

    - name: Remove stale files from an earlier frontend build
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          cd {{ web_root | quote }}
          find . -mindepth 1 -print0 | while IFS= read -r -d '' path; do
            if [[ ! -e {{ (frontend_dir ~ '/dist') | quote }}/"$path" ]]; then
              rm -rf -- "$path"
            fi
          done
        executable: /bin/bash
      register: stale_cleanup
      changed_when: false
      notify: Reload nginx

    - name: Install the Arcadia Nginx configuration
      ansible.builtin.copy:
        dest: /etc/nginx/nginx.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          user nginx;
          worker_processes auto;
          error_log /var/log/nginx/error.log notice;
          pid /run/nginx.pid;

          events {
              worker_connections 1024;
          }

          http {
              include /etc/nginx/mime.types;
              default_type application/octet-stream;
              sendfile on;
              keepalive_timeout 65;

              server {
                  listen 80 default_server;
                  server_name _;

                  root {{ web_root }};
                  index index.html;

                  location = /healthz {
                      access_log off;
                      default_type text/plain;
                      return 200 "Ok\n";
                  }

                  location / {
                      try_files $uri $uri/ /index.html;
                  }
              }
          }
      notify: Reload nginx

    - name: Remove obsolete Arcadia virtual-host configuration if present
      ansible.builtin.file:
        path: /etc/nginx/conf.d/arcadia.conf
        state: absent
      notify: Reload nginx

    - name: Validate the Nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Enable and start Nginx
      ansible.builtin.systemd_service:
        name: nginx
        enabled: true
        state: started

    - name: Apply pending Nginx changes before testing
      ansible.builtin.meta: flush_handlers

    - name: Verify the local health endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1/healthz
        status_code: 200
        return_content: true
      register: health_check
      failed_when: health_check.status != 200 or health_check.content | trim != "Ok"

  handlers:
    - name: Reload nginx
      ansible.builtin.systemd_service:
        name: nginx
        state: reloaded
