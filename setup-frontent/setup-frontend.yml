---
- name: Deploy the prebuilt Arcadia frontend on the current VM
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    frontend_dir: "{{ repo_root }}/frontend/main"
    frontend_dist_dir: "{{ frontend_dir }}/dist"
    web_root: /var/www/arcadia

  pre_tasks:
    - name: Verify Amazon Linux
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Amazon"
        fail_msg: "This playbook supports Amazon Linux only."

    - name: Verify the committed frontend artifact
      ansible.builtin.stat:
        path: "{{ frontend_dist_dir }}/index.html"
      register: frontend_index

    - name: Stop when the committed frontend artifact is missing
      ansible.builtin.assert:
        that:
          - frontend_index.stat.exists
          - frontend_index.stat.isreg
        fail_msg: >-
          Expected the prebuilt artifact at {{ frontend_dist_dir }}/index.html.
          Build frontend/main locally, commit the complete dist directory, pull
          that commit onto this VM, and rerun setup-frontent/setup.sh.

  tasks:
    - name: Install deployment packages
      ansible.builtin.dnf:
        name:
          - nginx
          - rsync
        state: present
        update_cache: true

    - name: Create the Nginx document root
      ansible.builtin.file:
        path: "{{ web_root }}"
        state: directory
        owner: nginx
        group: nginx
        mode: "0755"

    - name: Synchronize the committed frontend artifact
      ansible.builtin.command:
        argv:
          - rsync
          - --archive
          - --delete
          - --itemize-changes
          - --chown=nginx:nginx
          - "{{ frontend_dist_dir }}/"
          - "{{ web_root }}/"
      register: frontend_sync
      changed_when: frontend_sync.stdout | length > 0
      notify: Reload nginx

    - name: Install the Arcadia Nginx configuration
      ansible.builtin.copy:
        dest: /etc/nginx/nginx.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          user nginx;
          worker_processes auto;
          error_log /var/log/nginx/error.log notice;
          pid /run/nginx.pid;

          events {
              worker_connections 1024;
          }

          http {
              include /etc/nginx/mime.types;
              default_type application/octet-stream;
              sendfile on;
              keepalive_timeout 65;

              server {
                  listen 80 default_server;
                  server_name _;

                  root {{ web_root }};
                  index index.html;

                  location = /healthz {
                      access_log off;
                      default_type text/plain;
                      return 200 "Ok\n";
                  }

                  location / {
                      try_files $uri $uri/ /index.html;
                  }
              }
          }
      notify: Reload nginx

    - name: Remove obsolete Arcadia virtual-host configuration if present
      ansible.builtin.file:
        path: /etc/nginx/conf.d/arcadia.conf
        state: absent
      notify: Reload nginx

    - name: Validate the Nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Enable and start Nginx
      ansible.builtin.systemd_service:
        name: nginx
        enabled: true
        state: started

    - name: Apply pending Nginx changes before testing
      ansible.builtin.meta: flush_handlers

    - name: Verify the local health endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1/healthz
        status_code: 200
        return_content: true
      register: health_check
      failed_when: health_check.status != 200 or health_check.content | trim != "Ok"

  handlers:
    - name: Reload nginx
      ansible.builtin.systemd_service:
        name: nginx
        state: reloaded
